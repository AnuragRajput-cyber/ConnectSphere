server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/auth/**,/oauth2/**,/login/oauth2/**,/auth-docs/**,/api/v1/admin/**,/admin/**,/api/v1/reports/**,/reports/**
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**,/posts/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**,/comments/**
        - id: like-service
          uri: lb://like-service
          predicates:
            - Path=/api/v1/likes/**,/likes/**
        - id: follow-service
          uri: lb://follow-service
          predicates:
            - Path=/api/v1/follows/**,/follows/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**,/notifications/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**,/api/v1/stories/**,/media/**,/stories/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**,/api/v1/hashtags/**,/search/**,/hashtags/**
        - id: chat-service-rest
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**,/chat/**
        - id: chat-service-ws
          uri: lb:ws://chat-service
          predicates:
            - Path=/ws/chat,/ws/chat/**
        - id: frontend
          uri: http://localhost:4200
          predicates:
            - Path=/,/feed/**,/profile/**,/explore/**,/notifications/**,/stories/**,/chat/**,/assets/**,/media/**,/favicon.ico
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: auth-service
        url: /service-docs/auth
      - name: post-service
        url: /service-docs/posts
      - name: comment-service
        url: /service-docs/comments
      - name: like-service
        url: /service-docs/likes
      - name: follow-service
        url: /service-docs/follows
      - name: notification-service
        url: /service-docs/notifications
      - name: media-service
        url: /service-docs/media
      - name: search-service
        url: /service-docs/search
      - name: chat-service
        url: /service-docs/chat


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  services:
    auth-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
