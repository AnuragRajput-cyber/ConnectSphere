server:
  port: 8087
  forward-headers-strategy: framework

spring:
  application:
    name: media-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: mysql 
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: error
    org.springframework.web.context.request.async: error

app:
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:local}
    local-directory: ${MEDIA_LOCAL_DIRECTORY:uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:}
      key-prefix: ${AWS_S3_KEY_PREFIX:connectsphere}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container: ${AZURE_STORAGE_CONTAINER:}
      account-name: ${AZURE_STORAGE_ACCOUNT:}
      key-prefix: ${AZURE_STORAGE_KEY_PREFIX:connectsphere}
      public-base-url: ${AZURE_STORAGE_PUBLIC_BASE_URL:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true
