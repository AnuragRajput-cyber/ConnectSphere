services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: connectsphere-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SONAR_POSTGRES_DB:-sonarqube}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - sonarqube

  sonarqube:
    image: sonarqube:community
    container_name: connectsphere-sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sonarqube

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:

networks:
  sonarqube:
    driver: bridge
