services:
  mysql:
    image: mysql:8.4
    container_name: connectsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deployment/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - connectsphere

  redis:
    image: redis:7.4-alpine
    container_name: connectsphere-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - connectsphere

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: connectsphere-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - connectsphere

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: connectsphere-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - connectsphere

  service-registry:
    build:
      context: ./service-registry
    image: ${DOCKER_REGISTRY:-local}/connectsphere/service-registry:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - connectsphere

  auth-service:
    build:
      context: ./auth-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - rabbitmq
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_auth
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      POST_SERVICE_BASE_URL: http://post-service:8082
      COMMENT_SERVICE_BASE_URL: http://comment-service:8083
      LIKE_SERVICE_BASE_URL: http://like-service:8084
      FOLLOW_SERVICE_BASE_URL: http://follow-service:8085
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8086
      MEDIA_SERVICE_BASE_URL: http://media-service:8087
      SEARCH_SERVICE_BASE_URL: http://search-service:8088
      CHAT_SERVICE_BASE_URL: http://chat-service:8089
      GATEWAY_SERVICE_BASE_URL: http://api-gateway:8080
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@connectsphere.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_OAUTH_SUCCESS_REDIRECT_URL: ${APP_OAUTH_SUCCESS_REDIRECT_URL:-http://localhost:8088/auth/callback}
      APP_OAUTH_FAILURE_REDIRECT_URL: ${APP_OAUTH_FAILURE_REDIRECT_URL:-http://localhost:8088/login}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-ConnectSphere Admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  post-service:
    build:
      context: ./post-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/post-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - redis
      - rabbitmq
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_post
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_HEALTH_ENABLED: ${REDIS_HEALTH_ENABLED:-true}
      SPRING_CACHE_TYPE: redis
      POST_CACHE_TTL: ${POST_CACHE_TTL:-PT5M}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      FOLLOW_SERVICE_BASE_URL: http://follow-service:8085
      SEARCH_SERVICE_BASE_URL: http://search-service:8088
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBIT_HEALTH_ENABLED: ${RABBIT_HEALTH_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  comment-service:
    build:
      context: ./comment-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/comment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - rabbitmq
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_comment
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      POST_SERVICE_BASE_URL: http://post-service:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBIT_HEALTH_ENABLED: ${RABBIT_HEALTH_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  like-service:
    build:
      context: ./like-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/like-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - rabbitmq
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_like
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      POST_SERVICE_BASE_URL: http://post-service:8082
      COMMENT_SERVICE_BASE_URL: http://comment-service:8083
      MEDIA_SERVICE_BASE_URL: http://media-service:8087
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBIT_HEALTH_ENABLED: ${RABBIT_HEALTH_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  follow-service:
    build:
      context: ./follow-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/follow-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - rabbitmq
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_follow
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8086
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBIT_HEALTH_ENABLED: ${RABBIT_HEALTH_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  notification-service:
    build:
      context: ./notification-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - redis
      - rabbitmq
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_notification
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_HEALTH_ENABLED: ${REDIS_HEALTH_ENABLED:-true}
      SPRING_CACHE_TYPE: redis
      NOTIFICATION_CACHE_TTL: ${NOTIFICATION_CACHE_TTL:-PT10M}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBIT_HEALTH_ENABLED: ${RABBIT_HEALTH_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  media-service:
    build:
      context: ./media-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/media-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_media
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_LOCAL_DIRECTORY: /app/uploads
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_KEY_PREFIX: ${AWS_S3_KEY_PREFIX:-connectsphere}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY_PREFIX: ${AZURE_STORAGE_KEY_PREFIX:-connectsphere}
      AZURE_STORAGE_PUBLIC_BASE_URL: ${AZURE_STORAGE_PUBLIC_BASE_URL:-}
    volumes:
      - media-uploads:/app/uploads
    networks:
      - connectsphere

  search-service:
    build:
      context: ./search-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/search-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
      - rabbitmq
      - elasticsearch
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_search
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      POST_SERVICE_BASE_URL: http://post-service:8082
      APP_SEARCH_PROVIDER: elasticsearch
      ELASTICSEARCH_REPOSITORIES_ENABLED: "true"
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      ELASTICSEARCH_HEALTH_ENABLED: ${ELASTICSEARCH_HEALTH_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBIT_HEALTH_ENABLED: ${RABBIT_HEALTH_ENABLED:-true}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - connectsphere

  chat-service:
    build:
      context: ./chat-service
    image: ${DOCKER_REGISTRY:-local}/connectsphere/chat-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - service-registry
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: connectsphere_chat
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
    networks:
      - connectsphere

  api-gateway:
    build:
      context: ./api-gateway
    image: ${DOCKER_REGISTRY:-local}/connectsphere/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - service-registry
      - auth-service
      - post-service
      - comment-service
      - like-service
      - follow-service
      - notification-service
      - media-service
      - search-service
      - chat-service
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
    networks:
      - connectsphere

  frontend:
    build:
      context: ./connectsphere-web
    image: ${DOCKER_REGISTRY:-local}/connectsphere/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - connectsphere

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  media-uploads:

networks:
  connectsphere:
    driver: bridge
