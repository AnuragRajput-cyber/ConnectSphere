spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:connectsphere_auth}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    issuer: connectsphere-auth-service
    secret: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUYwMTIzNDU2Nzg5QUJDREVG
    access-token-ttl: PT24H
    refresh-token-ttl: P7D
  otp:
    ttl: PT10M
    max-attempts: 5
    return-code-in-response: true
  mail:
    enabled: false
  oauth:
    success-redirect-url: http://localhost:4200/auth/callback
    failure-redirect-url: http://localhost:4200/login
