server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  profiles:
    active: mysql
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true

app:
  jwt:
    issuer: connectsphere-auth-service
    secret: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUYwMTIzNDU2Nzg5QUJDREVG
    access-token-ttl: PT24H
    refresh-token-ttl: P7D
  otp:
    ttl: PT10M
    max-attempts: 5
    return-code-in-response: false
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@connectsphere.app}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:ConnectSphere Admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  oauth:
    success-redirect-url: ${APP_OAUTH_SUCCESS_REDIRECT_URL:http://localhost:4200/auth/callback}
    failure-redirect-url: ${APP_OAUTH_FAILURE_REDIRECT_URL:http://localhost:4200/login}

logging:
  level:
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: error
    org.springframework.web.context.request.async: error

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true
